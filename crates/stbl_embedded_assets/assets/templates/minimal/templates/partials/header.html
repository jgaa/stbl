<header>
  <div class="page">
    <a class="brand" href="{{ home_href }}">
      {% if site.logo %}<img class="brand-logo" src="{{ site.logo_url }}" alt="{{ site.title }} logo">{% endif %}
      <span class="brand-title">{{ site.title }}</span>
    </a>
    <nav aria-label="Primary" class="nav-desktop">
      <ul>
        {% for item in nav_items %}
        <li><a href="{{ item.href }}"{% if item.is_active %} aria-current="page"{% endif %}>{{ item.label }}</a></li>
        {% endfor %}
      </ul>
    </nav>
    <nav aria-label="Primary" class="nav-mobile">
      <details class="menu">
        <summary aria-label="Open menu">Menu</summary>
        <div class="menu-overlay">
          <ul>
            {% for item in nav_items %}
            <li><a href="{{ item.href }}"{% if item.is_active %} aria-current="page"{% endif %}>{{ item.label }}</a></li>
            {% endfor %}
          </ul>
        </div>
      </details>
    </nav>
  </div>
</header>
